# Render Blueprint for the API (free plan). The web app runs on Vercel and forwards /api/v1/* here, so browsers
# only ever talk to the Vercel address. Database (Neon), Redis (Redis Cloud) and email (Brevo) are external free
# services. Step by step: docs/deploy.md.
services:
  - type: web
    name: offerleap-api
    runtime: docker
    plan: free
    # The Dockerfile's last stage is the API.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render routes traffic to port 10000.
      - key: API_PORT
        value: '10000'
      # 512 MB instance: keep the heap below it.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # The free instance's disk is wiped on restart and spin-down: keep uploads in Postgres.
      - key: STORAGE_DRIVER
        value: database
      # Browser → Vercel → Render's proxy → API: the client IP is two proxies back.
      - key: TRUST_PROXY
        value: '2'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_DAILY_QUOTA
        value: '20'
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      # Set in the Render dashboard (secrets / per-deployment values).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
