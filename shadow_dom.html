<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Web Components Demo</title>
  </head>
  <body>
    <!-- 1. Định nghĩa template -->
    <template id="user-card-template">
      <style>
        .card {
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 16px;
          border: 1px solid #ddd;
          border-radius: 12px;
          font-family: Arial, sans-serif;
          max-width: 350px;
          margin-bottom: 12px;
        }

        .avatar {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: #dbeafe;
          color: #1d4ed8;
          display: grid;
          place-items: center;
          font-size: 24px;
          font-weight: bold;
        }

        h3 {
          margin: 0 0 6px;
          font-size: 18px;
        }

        p {
          margin: 0;
          color: #666;
        }
      </style>

      <div class="card">
        <div class="avatar">
          <slot name="avatar">?</slot>
        </div>

        <div>
          <h3><slot name="name">Chưa có tên</slot></h3>
          <p><slot name="role">Chưa có chức vụ</slot></p>
        </div>
      </div>
    </template>

    <!-- 2. Sử dụng component -->
    <user-card>
      <span slot="avatar">A</span>
      <span slot="name">An Nguyễn</span>
      <span slot="role">Frontend Developer</span>
    </user-card>

    <user-card>
      <span slot="avatar">B</span>
      <span slot="name">Bình Trần</span>
      <span slot="role">UI Designer</span>
    </user-card>

    <script>
      // 3. Định nghĩa Custom Element
      class UserCard extends HTMLElement {
        constructor() {
          // constructor là hàm khởi tạo của class, được gọi khi một instance của class được tạo ra. Trong trường hợp này, constructor được sử dụng để thiết lập Shadow DOM và gắn nội dung từ template vào Shadow DOM.
          super(); // super là từ khóa dùng để gọi constructor của lớp cha (HTMLElement). Điều này là cần thiết để đảm bảo rằng phần khởi tạo của lớp cha được thực hiện trước khi thêm các tính năng riêng của lớp con.

          // Tạo Shadow DOM
          const shadow = this.attachShadow({
            mode: "open",
          });

          // Lấy template đã định nghĩa
          const template = document.querySelector("#user-card-template");

          // Sao chép nội dung template
          const content = template.content.cloneNode(true);

          // Gắn nội dung vào Shadow DOM
          shadow.appendChild(content);
        }
      }

      // 4. Đăng ký thẻ HTML tùy chỉnh
      customElements.define("user-card", UserCard);
    </script>
  </body>
</html>
