packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: true
  # Telemetry ping from swagger-ui-dist — not needed.
  '@scarf/scarf': false
  # No-op preinstall echo / version-scheme warning — nothing to build.
  '@google/genai': false
  protobufjs: false
